name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Package (macOS)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Toolchain Versions
        run: |
          swift --version
          sw_vers

      - name: Run Unit Test Suite
        run: swift test --parallel

      - name: Build Release Binary
        run: swift build -c release

      - name: Verify Native App Packaging (Ceptra.app, DMG, ZIP, SHA256SUMS)
        run: |
          chmod +x scripts/package-app.sh
          ./scripts/package-app.sh \
            --version "0.0.0-ci" \
            --build-number "${{ github.run_number }}" \
            --github-repo "${{ github.repository }}" \
            --arch native

      - name: Verify Packaged Artifacts & Checksums
        run: |
          ls -lh build/
          test -d "build/Ceptra.app"
          test -x "build/Ceptra.app/Contents/MacOS/Ceptra"
          test -f "build/Ceptra.app/Contents/Resources/Ceptra.icns"
          test -f "build/SHA256SUMS.txt"
          (cd build && shasum -a 256 -c SHA256SUMS.txt)
