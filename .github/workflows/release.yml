name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version tag (e.g. v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean
      universal:
        description: "Build universal binary (Apple Silicon + Intel)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Native macOS Release
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Release Metadata
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
            UNIVERSAL="${{ inputs.universal }}"
            PRERELEASE="${{ inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"
            UNIVERSAL="true"
            if [[ "$TAG" == *-* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
          fi

          VERSION="${TAG#v}"
          if [[ "$UNIVERSAL" == "true" ]]; then
            ARCH_MODE="universal"
            ARCH_LABEL="universal"
          else
            ARCH_MODE="native"
            ARCH_LABEL="$(uname -m)"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "arch_mode=${ARCH_MODE}" >> "$GITHUB_OUTPUT"
          echo "arch_label=${ARCH_LABEL}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved Release: ${TAG} (version=${VERSION}, arch=${ARCH_MODE}, prerelease=${PRERELEASE})"

      - name: Run Unit Test Suite
        run: swift test --parallel

      - name: Package Ceptra.app, DMG, ZIP & Checksums
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          chmod +x scripts/package-app.sh
          ./scripts/package-app.sh \
            --version "${{ steps.meta.outputs.version }}" \
            --build-number "${{ github.run_number }}" \
            --github-repo "${{ github.repository }}" \
            --arch "${{ steps.meta.outputs.arch_mode }}"

      - name: Verify Release Artifacts
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          ARCH="${{ steps.meta.outputs.arch_label }}"
          test -f "build/Ceptra-${VERSION}-macOS-${ARCH}.dmg"
          test -f "build/Ceptra-${VERSION}-macOS-${ARCH}.zip"
          test -f "build/SHA256SUMS.txt"
          (cd build && shasum -a 256 -c SHA256SUMS.txt)

      - name: Compose Release Notes
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          ARCH="${{ steps.meta.outputs.arch_label }}"
          cat << EOF > build/RELEASE_NOTES.md
          ## Ceptra v${VERSION}

          Minimalist native macOS IDE built specifically for **CodeceptJS 4.x** — visualize scenario pipelines, edit tests with syntax highlighting, execute single scenarios or parallel workers, inspect JUnit/AI Trace/Screenshot reports, and self-update directly from GitHub Releases.

          ### Downloads
          - **macOS Disk Image:** \`Ceptra-${VERSION}-macOS-${ARCH}.dmg\` (drag \`Ceptra.app\` into \`/Applications\`)
          - **macOS App Archive:** \`Ceptra-${VERSION}-macOS-${ARCH}.zip\` (also used by Ceptra's in-app auto-updater)
          - **Checksums:** \`SHA256SUMS.txt\`

          ### First Launch Without an Apple Developer Certificate
          Releases built without a paid Apple Developer ID certificate are **ad-hoc signed** for Apple Silicon & Intel compatibility. On first launch after manual download, strip the macOS download quarantine attribute once:
          \`\`\`bash
          xattr -cr /Applications/Ceptra.app
          open /Applications/Ceptra.app
          \`\`\`
          Subsequent in-app updates via **Ceptra → Check for Updates…** automatically verify \`SHA256SUMS.txt\`, clear quarantine flags, quit the running app, swap \`Ceptra.app\`, and relaunch.

          ### SHA-256 Checksums
          \`\`\`
          $(cat build/SHA256SUMS.txt)
          \`\`\`
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Ceptra ${{ steps.meta.outputs.tag }}
          body_path: build/RELEASE_NOTES.md
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            build/Ceptra-*.dmg
            build/Ceptra-*.zip
            build/SHA256SUMS.txt
